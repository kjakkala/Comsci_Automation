<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-label="QA robot">
  <style>
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .arm { transform-box: fill-box; transform-origin: 18% 30%; animation: wave .55s ease-in-out infinite alternate; }
    .leg-a { transform-box: fill-box; transform-origin: top center; animation: step .38s ease-in-out infinite alternate; }
    .leg-b { transform-box: fill-box; transform-origin: top center; animation: step .38s ease-in-out infinite alternate-reverse; }
    .flame { opacity: 0; transform-origin: 60px 76px; }
    .launch .flame { opacity: 1; animation: burn .18s ease-in-out infinite alternate; }
    @keyframes blink { 0%, 45%, 49%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.12); } }
    @keyframes wave { from { transform: rotate(-9deg); } to { transform: rotate(25deg); } }
    @keyframes step { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
    @keyframes burn { from { transform: scaleY(.75); } to { transform: scaleY(1.2); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
  <g class="flame">
    <path d="M51 69 60 94 69 69Z" fill="#ffb02e"/>
    <path d="M56 70 60 86 64 70Z" fill="#f05b35"/>
  </g>
  <path d="M42 63 38 81" fill="none" stroke="#2878a5" stroke-width="7" stroke-linecap="round" class="leg-a"/>
  <path d="M75 63 80 81" fill="none" stroke="#2878a5" stroke-width="7" stroke-linecap="round" class="leg-b"/>
  <path d="M31 32 18 20" fill="none" stroke="#2878a5" stroke-width="7" stroke-linecap="round" class="arm"/>
  <path d="M17 20 12 14M17 20 20 12M17 20 9 22" fill="none" stroke="#2878a5" stroke-width="4" stroke-linecap="round" class="arm"/>
  <path d="M87 39 100 50" fill="none" stroke="#2878a5" stroke-width="7" stroke-linecap="round"/>
  <rect x="29" y="27" width="59" height="43" rx="13" fill="#d8f0f2" stroke="#2878a5" stroke-width="4"/>
  <rect x="36" y="36" width="45" height="24" rx="8" fill="#173d56"/>
  <circle cx="49" cy="48" r="3.5" fill="#8bf0c7" class="eye"/>
  <circle cx="68" cy="48" r="3.5" fill="#8bf0c7" class="eye"/>
  <path d="M52 56h13" stroke="#8bf0c7" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="58" cy="24" r="3" fill="#f3a83b"/>
  <path d="M32 83h14M75 83h14" stroke="#173d56" stroke-width="6" stroke-linecap="round"/>
</svg>