[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
	page_section(name): Page/module name used for dashboard grouping.
	ui_flow(name): Human label of the flow/action under test.
	testrail_case(case_id): TestRail case ID associated with the pytest case.
	dashboard_title(title): Human-readable title shown in the dashboard.
	test_labels(*labels): Test classifications shown on the dashboard.
